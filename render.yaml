services:
  - type: web
    name: okuls-navproje
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_CHIEF_USERNAME
        value: alansefi
      - key: BOOTSTRAP_CHIEF_PASSWORD
        generateValue: true
      - key: BOOTSTRAP_CHIEF_NAME
        value: Alan Şefi
      - key: MAX_UPLOAD_MB
        value: "16"
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: APP_TIMEZONE
        value: Europe/Istanbul
      - key: DB_NAME
        value: test
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "120"
